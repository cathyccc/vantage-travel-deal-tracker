name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 1. Install Playwright Browsers + Linux System Deps
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # 2. Run Vitest
      - name: Run Unit Tests
        run: npx vitest run

      # 3. Run Playwright (The new TS tests)
      - name: Run E2E Tests
        run: npx playwright test

      # 4. Save the "Black Box" (Traces/Screenshots) if things fail
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30